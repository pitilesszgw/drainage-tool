<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>卡密格式转换工具</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #eef6ff;
      --surface: #ffffff;
      --surface-soft: #f6fbff;
      --ink: #081827;
      --muted: #5e7187;
      --line: #cfe0f1;
      --primary: #075fa8;
      --primary-dark: #064a84;
      --primary-soft: #d9edff;
      --ok: #087f5b;
      --warn: #b45309;
      --shadow: 0 24px 70px rgba(12, 74, 129, 0.13);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(135deg, rgba(7, 95, 168, 0.12), transparent 34%),
        linear-gradient(315deg, rgba(14, 165, 233, 0.18), transparent 42%),
        var(--bg);
      color: var(--ink);
      font-family: "Trebuchet MS", "Microsoft YaHei", sans-serif;
      letter-spacing: 0;
    }

    button,
    textarea {
      font: inherit;
    }

    .page {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 42px 0;
    }

    .hero {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 24px;
      align-items: end;
      margin-bottom: 22px;
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--primary);
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(32px, 5vw, 58px);
      line-height: 1.02;
      max-width: 720px;
    }

    .intro {
      margin: 14px 0 0;
      color: var(--muted);
      line-height: 1.7;
      max-width: 760px;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 40px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.72);
      color: var(--muted);
      font-size: 14px;
      white-space: nowrap;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 999px;
      background: var(--primary);
      box-shadow: 0 0 0 5px rgba(7, 95, 168, 0.12);
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 18px;
      align-items: stretch;
    }

    .panel {
      min-width: 0;
      border: 1px solid rgba(207, 224, 241, 0.9);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.86);
      box-shadow: var(--shadow);
      overflow: hidden;
      backdrop-filter: blur(12px);
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      min-height: 64px;
      padding: 16px 18px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, #ffffff, var(--surface-soft));
    }

    .panel-title {
      margin: 0;
      font-size: 18px;
    }

    .panel-note {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: flex-end;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 38px;
      padding: 0 13px;
      border: 1px solid transparent;
      border-radius: 7px;
      background: var(--primary);
      color: #ffffff;
      cursor: pointer;
      font-weight: 700;
      transition: transform 160ms ease, background-color 160ms ease, border-color 160ms ease;
    }

    .btn:hover {
      background: var(--primary-dark);
      transform: translateY(-1px);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn.secondary {
      border-color: var(--line);
      background: #ffffff;
      color: var(--primary);
    }

    .btn.secondary:hover {
      background: var(--primary-soft);
    }

    .btn svg {
      width: 17px;
      height: 17px;
      stroke-width: 2.2;
    }

    textarea {
      display: block;
      width: 100%;
      min-height: 430px;
      resize: vertical;
      border: 0;
      outline: 0;
      padding: 18px;
      background: transparent;
      color: var(--ink);
      line-height: 1.6;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      font-size: 14px;
    }

    textarea::placeholder {
      color: #8497aa;
    }

    textarea:focus-visible {
      box-shadow: inset 0 0 0 3px rgba(7, 95, 168, 0.24);
    }

    #output {
      background:
        linear-gradient(90deg, rgba(7, 95, 168, 0.06), transparent 42%),
        transparent;
    }

    .feedback {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 16px;
      color: var(--muted);
      font-size: 14px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 32px;
      padding: 0 11px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.7);
    }

    .tag.ok {
      border-color: rgba(8, 127, 91, 0.25);
      color: var(--ok);
      background: rgba(8, 127, 91, 0.08);
    }

    .tag.warn {
      border-color: rgba(180, 83, 9, 0.28);
      color: var(--warn);
      background: rgba(180, 83, 9, 0.08);
    }

    .notice {
      margin-top: 18px;
      padding: 15px 17px;
      border: 1px solid rgba(7, 95, 168, 0.18);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.66);
      color: var(--muted);
      line-height: 1.7;
      font-size: 14px;
    }

    @media (max-width: 820px) {
      .page {
        width: min(100% - 22px, 1180px);
        padding: 26px 0;
      }

      .hero,
      .workspace {
        grid-template-columns: 1fr;
      }

      .status-pill {
        justify-self: start;
      }

      .panel-head {
        align-items: flex-start;
        flex-direction: column;
      }

      .actions {
        justify-content: flex-start;
      }

      textarea {
        min-height: 300px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="hero" aria-labelledby="page-title">
      <div>
        <p class="eyebrow">Local Formatter</p>
        <h1 id="page-title">卡密格式转换工具</h1>
        <p class="intro">粘贴一行或多行竖线分隔的卡密数据，自动整理成账号、密码、2FA、邮箱、邮箱密码、辅助邮箱和 cookie 格式。解析只在本地浏览器执行。</p>
      </div>
      <div class="status-pill" aria-live="polite">
        <span class="dot" aria-hidden="true"></span>
        <span id="status">等待输入</span>
      </div>
    </section>

    <section class="workspace" aria-label="格式转换区域">
      <article class="panel">
        <div class="panel-head">
          <div>
            <h2 class="panel-title">原始卡密</h2>
            <p class="panel-note">每行一个账号，支持字段位置变化，邮箱也可以在 cookie 后面。</p>
          </div>
          <div class="actions">
            <button class="btn secondary" id="sampleBtn" type="button" title="填入脱敏示例">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M4 4h16v16H4z"></path><path d="M8 9h8"></path><path d="M8 15h5"></path></svg>
              示例
            </button>
            <button class="btn secondary" id="clearBtn" type="button" title="清空输入和输出">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M3 6h18"></path><path d="M8 6V4h8v2"></path><path d="M7 6l1 14h8l1-14"></path><path d="M10 11v5"></path><path d="M14 11v5"></path></svg>
              清空
            </button>
          </div>
        </div>
        <textarea id="input" spellcheck="false" placeholder="例如：账号|密码|2FA|邮箱|邮箱密码|辅助邮箱|cookie&#10;账号|密码|2FA|邮箱|邮箱密码|辅助邮箱|cookie"></textarea>
      </article>

      <article class="panel">
        <div class="panel-head">
          <div>
            <h2 class="panel-title">整理结果</h2>
            <p class="panel-note">结果会实时生成，可直接复制。</p>
          </div>
          <div class="actions">
            <button class="btn" id="copyBtn" type="button" title="复制整理后的结果">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
              复制
            </button>
          </div>
        </div>
        <textarea id="output" spellcheck="false" readonly placeholder="这里会显示转换后的格式"></textarea>
      </article>
    </section>

    <div class="feedback" id="feedback" aria-live="polite">
      <span class="tag">未检测到内容</span>
    </div>

    <p class="notice">提示：每行解析为一个账号，输出会连续排列不插入空行。如果某项无法识别，会在下方状态里标出。cookie 会尽量合并包含 c_user、xs、fr、datr 等键的片段，并补齐末尾分号。</p>
  </main>

  <script id="parser-source" type="text/plain">
    const LABELS = [
      ["account", "账号"],
      ["password", "密码"],
      ["twoFactor", "2fa"],
      ["email", "邮箱"],
      ["emailPassword", "邮箱密码"],
      ["recoveryEmail", "辅助邮箱"],
      ["cookie", "cookie"]
    ];

    function splitParts(raw) {
      return raw
        .split("|")
        .map((part) => part.trim())
        .filter(Boolean);
    }

    function isEmail(value) {
      return /^[^\s@|;]+@[^\s@|;]+\.[^\s@|;]+$/.test(value);
    }

    function isCookiePart(value) {
      return /(^|;)\s*(c_user|xs|fr|datr|sb|wd|presence|locale)=/i.test(value);
    }

    function isTwoFactor(value) {
      const normalized = value.replace(/\s+/g, "");
      return /^[A-Z2-7]{16,64}$/.test(normalized)
        && /^[A-Z2-7\s]+$/.test(value)
        && /[A-Z]/.test(normalized)
        && /\d/.test(normalized);
    }

    function isAccount(value) {
      return /^\d{8,}$/.test(value);
    }

    function isLongToken(value) {
      return /^[A-Za-z0-9_-]{80,}$/.test(value);
    }

    function normalizeCookie(value) {
      const trimmed = value.trim().replace(/\|+$/g, "");
      return trimmed && !trimmed.endsWith(";") ? `${trimmed};` : trimmed;
    }

    function pickPassword(parts, usedIndexes, accountIndex) {
      if (accountIndex >= 0) {
        const afterAccount = accountIndex + 1;
        if (!usedIndexes.has(afterAccount) && isPasswordCandidate(parts[afterAccount])) {
          return afterAccount;
        }
      }

      return parts.findIndex((part, index) => !usedIndexes.has(index) && isPasswordCandidate(part));
    }

    function pickEmailPassword(parts, usedIndexes, primaryEmailIndex) {
      if (primaryEmailIndex >= 0) {
        const afterEmail = primaryEmailIndex + 1;
        if (!usedIndexes.has(afterEmail) && isPasswordCandidate(parts[afterEmail])) {
          return afterEmail;
        }
      }

      return -1;
    }

    function assignEmails(parts, usedIndexes, emailIndexes) {
      if (!emailIndexes.length) {
        return { emailIndex: -1, emailPasswordIndex: -1, recoveryEmailIndex: -1 };
      }

      const primaryEmailIndex = emailIndexes[0];
      const emailPasswordIndex = pickEmailPassword(parts, usedIndexes, primaryEmailIndex);

      if (emailPasswordIndex >= 0) {
        return {
          emailIndex: primaryEmailIndex,
          emailPasswordIndex,
          recoveryEmailIndex: emailIndexes[1] ?? -1
        };
      }

      return {
        emailIndex: -1,
        emailPasswordIndex: -1,
        recoveryEmailIndex: emailIndexes[1] ?? primaryEmailIndex
      };
    }

    function isPasswordCandidate(value) {
      return Boolean(value)
        && !isEmail(value)
        && !isCookiePart(value)
        && !isTwoFactor(value)
        && !isAccount(value)
        && !isLongToken(value);
    }

    function parseCredentialLine(raw) {
      const parts = splitParts(raw);
      const result = {
        account: "",
        password: "",
        twoFactor: "",
        email: "",
        emailPassword: "",
        recoveryEmail: "",
        cookie: ""
      };
      const usedIndexes = new Set();

      const cookieParts = [];
      parts.forEach((part, index) => {
        if (isCookiePart(part)) {
          cookieParts.push(part);
          usedIndexes.add(index);
        }
      });
      result.cookie = normalizeCookie(cookieParts.join(";"));

      const accountIndex = parts.findIndex((part, index) => !usedIndexes.has(index) && isAccount(part));
      if (accountIndex >= 0) {
        result.account = parts[accountIndex];
        usedIndexes.add(accountIndex);
      } else {
        const accountFromCookie = result.cookie.match(/(?:^|;)\s*c_user=(\d+)/i);
        if (accountFromCookie) {
          result.account = accountFromCookie[1];
        }
      }

      const twoFactorIndex = parts.findIndex((part, index) => !usedIndexes.has(index) && isTwoFactor(part));
      if (twoFactorIndex >= 0) {
        result.twoFactor = parts[twoFactorIndex];
        usedIndexes.add(twoFactorIndex);
      }

      const emailIndexes = [];
      parts.forEach((part, index) => {
        if (!usedIndexes.has(index) && isEmail(part)) {
          emailIndexes.push(index);
        }
      });

      const emailAssignment = assignEmails(parts, usedIndexes, emailIndexes);

      if (emailAssignment.emailIndex >= 0) {
        result.email = parts[emailAssignment.emailIndex];
        usedIndexes.add(emailAssignment.emailIndex);
      }

      if (emailAssignment.emailPasswordIndex >= 0) {
        result.emailPassword = parts[emailAssignment.emailPasswordIndex];
        usedIndexes.add(emailAssignment.emailPasswordIndex);
      }

      if (emailAssignment.recoveryEmailIndex >= 0) {
        result.recoveryEmail = parts[emailAssignment.recoveryEmailIndex];
        usedIndexes.add(emailAssignment.recoveryEmailIndex);
      }

      const passwordIndex = pickPassword(parts, usedIndexes, accountIndex);
      if (passwordIndex >= 0) {
        result.password = parts[passwordIndex];
        usedIndexes.add(passwordIndex);
      }

      return result;
    }

    function formatCredential(data) {
      return LABELS.map(([key, label]) => `${label}：${data[key] || ""}`).join("\n");
    }

    function splitRecords(raw) {
      return raw
        .split(/\r?\n/)
        .map((line) => line.trim())
        .filter(Boolean);
    }

    function parseCredentialBatch(raw) {
      return splitRecords(raw).map(parseCredentialLine);
    }

    function formatCredentialBatch(records) {
      return records.map(formatCredential).join("\n");
    }
  </script>

  <script>
    const parserCode = document.getElementById("parser-source").textContent;
    Function(`${parserCode}; window.parseCredentialLine = parseCredentialLine; window.formatCredential = formatCredential; window.parseCredentialBatch = parseCredentialBatch; window.formatCredentialBatch = formatCredentialBatch;`)();

    const input = document.getElementById("input");
    const output = document.getElementById("output");
    const status = document.getElementById("status");
    const feedback = document.getElementById("feedback");
    const copyBtn = document.getElementById("copyBtn");
    const clearBtn = document.getElementById("clearBtn");
    const sampleBtn = document.getElementById("sampleBtn");

    const fields = [
      ["account", "账号"],
      ["password", "密码"],
      ["twoFactor", "2FA"],
      ["email", "邮箱"],
      ["emailPassword", "邮箱密码"],
      ["recoveryEmail", "辅助邮箱"],
      ["cookie", "Cookie"]
    ];

    const sample = [
      "10000000000001|DemoPass#2026|JBSWY3DPEHPK3PXPJBSWY3DPEHPK3PXP|user@example.com|MailPass#2026|backup@example.net|c_user=10000000000001;xs=demo;fr=demo;datr=demo;|",
      "10000000000002|OtherPass#2026|KRSXG5DSNFXGOIDPNYQHG5DSNFXGOIDP|second@example.com|MailPass#2027|second-backup@example.net|c_user=10000000000002;xs=demo2;fr=demo2;datr=demo2;"
    ].join("\n");

    function renderTags(records) {
      const completeCount = records.filter((record) => fields.every(([key]) => record[key])).length;
      const incompleteCount = records.length - completeCount;
      const tags = [`<span class="tag ok">已解析 ${records.length} 个账号</span>`];

      if (incompleteCount) {
        tags.push(`<span class="tag warn">${incompleteCount} 个账号缺少字段</span>`);
      } else {
        tags.push('<span class="tag ok">字段完整</span>');
      }

      feedback.innerHTML = tags.join("");
      status.textContent = records.length ? `已解析 ${records.length} 个账号` : "等待输入";
    }

    function updateOutput() {
      const raw = input.value.trim();
      if (!raw) {
        output.value = "";
        status.textContent = "等待输入";
        feedback.innerHTML = '<span class="tag">未检测到内容</span>';
        return;
      }

      const records = window.parseCredentialBatch(raw);
      output.value = window.formatCredentialBatch(records);
      renderTags(records);
    }

    async function copyOutput() {
      if (!output.value.trim()) {
        status.textContent = "没有可复制内容";
        return;
      }

      try {
        await navigator.clipboard.writeText(output.value);
        status.textContent = "已复制";
      } catch {
        output.focus();
        output.select();
        document.execCommand("copy");
        status.textContent = "已复制";
      }
    }

    input.addEventListener("input", updateOutput);
    copyBtn.addEventListener("click", copyOutput);
    clearBtn.addEventListener("click", () => {
      input.value = "";
      updateOutput();
      input.focus();
    });
    sampleBtn.addEventListener("click", () => {
      input.value = sample;
      updateOutput();
      input.focus();
    });
  </script>
</body>
</html>
